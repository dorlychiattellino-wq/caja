<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Flujo de Caja</title>
<meta name="description" content="Tu flujo de caja, simple y claro: entradas, salidas, saldo, pendientes, alcancías y análisis.">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1f1d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="caja-manifest.json">
<link rel="icon" href="caja-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="caja-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flujo de Caja">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eef2f1; --line:#e1e6e4;
  --ink:#0b1413; --ink-2:#4f5b59; --ink-3:#86908e; --grid:#e6eae8;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#d9f1ee;
  --in:#0f9f6e; --in-soft:#dcf5ea; --out:#e04848; --out-soft:#fbe3e3;
  --warn:#eda100; --warn-soft:#fff2cf;
  --shadow:0 1px 2px rgba(11,20,19,.06),0 8px 24px rgba(11,20,19,.06);
  --r:18px; --tab-h:64px;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#0d1211; --surface:#171e1d; --surface-2:#1f2826; --line:#273130;
  --ink:#f0f3f2; --ink-2:#b9c2c0; --ink-3:#7f8a88; --grid:#263030;
  --brand:#2bb3a6; --brand-ink:#06201d; --brand-soft:#15302d;
  --in:#34c48d; --in-soft:#143328; --out:#f06a6a; --out-soft:#3a1d1d;
  --warn:#f0b429; --warn-soft:#3a3010;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#1a9a1a;--c7:#9085e9;--c8:#e66767;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:17px}h3{font-size:14px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--ink-3)}.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.top .brand{display:flex;align-items:center;gap:10px}
header.top .brand img{width:30px;height:30px;border-radius:9px}
main{flex:1;padding:4px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 90px)}
.view{display:none;animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.tight{padding:12px 16px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack>*+*{margin-top:10px}

/* Hero saldo */
.hero{background:linear-gradient(140deg,var(--brand) 0%,#115e59 100%);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(140deg,#0f766e 0%,#0b3d39 100%)}}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .label{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.hero .amount{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 12px;line-height:1.05}
.hero .sub{display:flex;gap:14px;flex-wrap:wrap}
.hero .sub div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;flex:1;min-width:120px}
.hero .sub .label{font-size:11px}
.hero .sub b{font-size:16px;display:block;margin-top:2px}

/* stat tiles */
.tile{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.tile .label{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.tile .val{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.tile .hint{font-size:12px;color:var(--ink-2);margin-top:2px}

/* list items */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0;background:var(--surface-2)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:700;white-space:nowrap;text-align:right}
.item .amt .s{text-align:right}
.day-h{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:14px 4px 4px;display:flex;justify-content:space-between}
.empty{padding:28px 10px;text-align:center;color:var(--ink-3)}
.empty .big{font-size:36px;margin-bottom:6px}

/* chips & segmented */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button.on.ing{color:var(--in)}.seg button.on.egr{color:var(--out)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.late{background:var(--out-soft);color:var(--out)}
.pill.soon{background:var(--warn-soft);color:#8a5a00}
@media (prefers-color-scheme: dark){.pill.soon{color:var(--warn)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);width:100%}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:11px}
.btn.ghost{background:none;color:var(--brand);padding:8px}
.link{color:var(--brand);font-weight:600;font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:18px}

/* forms */
label.f{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin:14px 0 6px}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:12px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--brand);background:var(--surface)}
.amount-input{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:6px 16px}
.amount-input span{font-size:22px;color:var(--ink-3);font-weight:600}
.amount-input input{flex:1;border:0;background:none;font-size:34px;font-weight:800;outline:none;min-width:0;letter-spacing:-.02em}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch .tog{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.switch .tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch .tog.on{background:var(--brand)}.switch .tog.on::after{left:23px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.emojis{display:flex;gap:6px;flex-wrap:wrap}
.emojis button{width:40px;height:40px;border-radius:12px;font-size:20px;background:var(--surface-2)}
.emojis button.on{background:var(--brand-soft);outline:2px solid var(--brand)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin-bottom:6px}

/* tab bar */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto;height:var(--tab-h);color:inherit}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
.fab{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);width:58px;height:58px;border-radius:20px;background:var(--brand);color:var(--brand-ink);font-size:30px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(15,118,110,.4);z-index:41}
@media (max-width:560px){.fab{right:16px}}

/* charts */
.chart{width:100%;overflow:visible;display:block}
.chart text{font-family:inherit;fill:var(--ink-3);font-size:11px}
.chart .grid line{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:8px;pointer-events:none;display:none;white-space:nowrap;box-shadow:var(--shadow)}
.bar-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.bar-row .n{width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.bar-row .b{flex:1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-row .b i{display:block;height:100%;border-radius:5px}
.bar-row .v{width:84px;text-align:right;font-weight:600;font-size:13px}
.pct .bar-row .n{width:auto;flex:1;font-size:13px}.pct .bar-row .b{width:56px;flex:none}.pct .bar-row .v{width:38px}
.progress{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;border-radius:6px;transition:width .4s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:6px;box-shadow:var(--shadow);margin-bottom:12px}
.month-nav b{font-size:15px;text-transform:capitalize}
.month-nav button{width:38px;height:38px;border-radius:10px;font-size:18px;color:var(--ink-2)}
.insight{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0}
.insight .e{font-size:22px;width:30px;text-align:center}
.insight b{display:block}
.insight span{font-size:13px;color:var(--ink-2)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:transparent;font-size:16px;font-weight:800;background:var(--surface)}
.chk:active,.chk:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.usd{font-size:11px;color:var(--ink-3);font-weight:500;display:block;margin-top:1px}
.cur{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.cur button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-3)}
.cur button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.conv{font-size:13px;color:var(--ink-2);margin-top:6px;min-height:18px}
.tcpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink-2);box-shadow:var(--shadow);margin-bottom:14px}
.tcpill b{color:var(--ink)}
.install{display:none;background:var(--brand-soft);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:14px}
.install.show{display:flex;gap:12px;align-items:center}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand"><img src="caja-icon.svg" alt=""><h1 id="pageTitle">Flujo de Caja</h1></div>
  <div class="row" id="headerActions"></div>
</header>
<main>
  <section id="v-home" class="view active"></section>
  <section id="v-mov" class="view"></section>
  <section id="v-pend" class="view"></section>
  <section id="v-alc" class="view"></section>
  <section id="v-ana" class="view"></section>
  <section id="v-ajustes" class="view"></section>
</main>
<button class="fab" id="fab" aria-label="Agregar">+</button>
<nav class="tabs"><div class="in">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-v="mov"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</button>
  <button data-v="pend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Pendientes</button>
  <button data-v="alc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0-3.5-3-6-7-6s-7 2.5-7 6c0 2 1 3.5 2 4.5V18h3v-1.5h4V18h3v-3.5c1-1 2-2.5 2-4.5z"/><path d="M12 4V2M9 10h.01"/></svg>Alcancías</button>
  <button data-v="ana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análisis</button>
</div></nav>
</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== DATOS ===================== */
const KEY='flujocaja_v1';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const PALETTE=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948','#0f766e','#8b5e34'];
const EMOJIS=['💼','🏠','🛒','🍽️','🚗','💊','🎓','🎁','✈️','📱','💡','👕','🐶','🎬','💪','🧾','💰','📈','🏦','🛠️','☕','🎯','🚌','👶','🎮','🏖️','🚲','📚','🌱','❤️'];
const defaultData=()=>({
  categorias:[
    {id:'c_sueldo',nombre:'Sueldo',tipo:'ingreso',color:'#1baf7a',emoji:'💼'},
    {id:'c_ventas',nombre:'Ventas',tipo:'ingreso',color:'#2a78d6',emoji:'📈'},
    {id:'c_otros_in',nombre:'Otros ingresos',tipo:'ingreso',color:'#6250d6',emoji:'💰'},
    {id:'c_super',nombre:'Supermercado',tipo:'egreso',color:'#eb6834',emoji:'🛒'},
    {id:'c_hogar',nombre:'Hogar',tipo:'egreso',color:'#2a78d6',emoji:'🏠'},
    {id:'c_servicios',nombre:'Servicios',tipo:'egreso',color:'#eda100',emoji:'💡'},
    {id:'c_transporte',nombre:'Transporte',tipo:'egreso',color:'#6250d6',emoji:'🚗'},
    {id:'c_salud',nombre:'Salud',tipo:'egreso',color:'#e34948',emoji:'💊'},
    {id:'c_ocio',nombre:'Ocio',tipo:'egreso',color:'#e87ba4',emoji:'🎬'},
    {id:'c_otros_out',nombre:'Otros gastos',tipo:'egreso',color:'#8b5e34',emoji:'🧾'},
  ],
  movimientos:[], pendientes:[], alcancias:[],
  config:{moneda:'ARS',decimales:0,tc:null}
});
let D=load();
function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);return Object.assign(defaultData(),d)}}catch(e){}return defaultData()}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}

/* ===================== UTIL ===================== */
const fmtMoney=(n,compact=false)=>{
  const dec=D.config.decimales??0;
  if(compact&&Math.abs(n)>=1e6)return (n<0?'-':'')+'$'+(Math.abs(n)/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M';
  if(compact&&Math.abs(n)>=1e4)return (n<0?'-':'')+'$'+Math.round(Math.abs(n)/1e3).toLocaleString('es-AR')+' mil';
  return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
};
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const fmtDate=s=>{const [y,m,d]=s.split('-').map(Number);const t=today();if(s===t)return 'Hoy';const dt=new Date(y,m-1,d);const yest=new Date();yest.setDate(yest.getDate()-1);if(s===ymd(yest))return 'Ayer';return d+' '+MESES_C[m-1].toLowerCase()+(y!==new Date().getFullYear()?' '+y:'')};
const ymd=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const daysDiff=s=>{const [y,m,d]=s.split('-').map(Number);const a=new Date(y,m-1,d);const t=new Date();t.setHours(0,0,0,0);return Math.round((a-t)/86400000)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=id=>D.categorias.find(c=>c.id===id)||{nombre:'Sin categoría',color:'#888',emoji:'❔'};
const sum=a=>a.reduce((s,x)=>s+x,0);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
const $=s=>document.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const parseNum=v=>{if(v==null)return 0;v=String(v).replace(/\s|\$/g,'');if(/,\d{1,2}$/.test(v)){v=v.replace(/\./g,'').replace(',','.')}else{v=v.replace(/,/g,'')}const n=parseFloat(v);return isNaN(n)?0:n};

/* ===================== DÓLAR (TC Banco Nación venta) ===================== */
const fmtUsd=n=>'US$ '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
const tcHoy=()=>D.config.tc?.valor||0;
const tcLabel=()=>{const t=D.config.tc;if(!t)return 'sin cotización';const d=new Date(t.fecha);return (t.manual?'cargado a mano':'BNA venta')+' · '+d.getDate()+'/'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const FUENTES_TC=[
  {url:'https://dolarapi.com/v1/dolares/oficial',pick:j=>j.venta},
  {url:'https://api.bluelytics.com.ar/v2/latest',pick:j=>j.oficial?.value_sell}
];
async function actualizarTC(force){
  const t=D.config.tc;
  if(!force&&t&&!t.manual&&Date.now()-new Date(t.fecha).getTime()<60*60*1000)return false; // menos de 1 h: no hace falta
  if(!navigator.onLine)return false;
  for(const f of FUENTES_TC){try{const r=await fetch(f.url,{cache:'no-store'});const j=await r.json();const v=Number(f.pick(j));if(v>0){
    if(t?.manual&&!force)return false; // respeta el valor manual salvo que se pida actualizar
    D.config.tc={valor:v,fecha:new Date().toISOString(),fuente:f.url.includes('dolarapi')?'dolarapi.com (oficial BNA)':'bluelytics',manual:false};save();return true}}catch(e){}}
  return false;
}
/* Montos en pesos: los movimientos quedan congelados al TC del día en que se registraron;
   pendientes y alcancías en dólares se convierten al TC de hoy. */
const montoARS=x=>x.moneda==='USD'?Math.round(x.montoUsd*tcHoy()):x.monto;
const alcObj=a=>a.moneda==='USD'?Math.round(a.objetivo*tcHoy()):a.objetivo;
const alcAho=a=>a.moneda==='USD'?Math.round(a.ahorrado*tcHoy()):a.ahorrado;
const fmtAlc=(a,v)=>a.moneda==='USD'?fmtUsd(v):fmtMoney(v);

/* ===================== CÁLCULOS ===================== */
function totales(){
  const ing=sum(D.movimientos.filter(m=>m.tipo==='ingreso').map(m=>m.monto));
  const egr=sum(D.movimientos.filter(m=>m.tipo==='egreso').map(m=>m.monto));
  const saldo=ing-egr;
  const apartado=sum(D.alcancias.filter(a=>a.descontar).map(alcAho));
  const cobrar=sum(D.pendientes.filter(p=>p.tipo==='cobrar').map(montoARS));
  const pagar=sum(D.pendientes.filter(p=>p.tipo==='pagar').map(montoARS));
  return {ing,egr,saldo,apartado,disponible:saldo-apartado,cobrar,pagar,proyectado:saldo-apartado+cobrar-pagar};
}
function movsMes(y,m){return D.movimientos.filter(x=>{const [yy,mm]=x.fecha.split('-').map(Number);return yy===y&&mm===m})}

/* ===================== NAVEGACIÓN ===================== */
let view='home';

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#fab').onclick=()=>{if(view==='pend')formPendiente();else if(view==='alc')formAlcancia();else formMovimiento()};
function renderHeader(){

  <div class="card tight"><div class="row between" style="margin-bottom:4px"><h3>Últimos movimientos</h3><button class="link" data-go="mov">Ver todo</button></div>

function movItem(m){const c=cat(m.catId);return `<div class="item" data-mov="${m.id}"><div class="ico" style="background:${c.color}22">${c.emoji}</div><div class="body"><div class="t">${esc(m.nota||c.nombre)}</div><div class="s">${esc(c.nombre)} · ${fmtDate(m.fecha)}</div></div><div class="amt num ${m.tipo==='ingreso'?'in':'out'}">${m.tipo==='ingreso'?'+':'−'}${fmtMoney(m.monto)}${m.moneda==='USD'?`<span class="usd">${fmtUsd(m.montoUsd)} · TC ${fmtMoney(m.tc)}</span>`:''}</div></div>`}
function pendItem(p){const c=cat(p.catId);const d=daysDiff(p.fecha);const pill=d<0?`<span class="pill late">Vencido hace ${-d} d</span>`:d===0?`<span class="pill soon">Hoy</span>`:d<=7?`<span class="pill soon">En ${d} d</span>`:`<span class="pill">${fmtDate(p.fecha)}</span>`;
  return `<div class="item"><button class="chk" data-chk="${p.id}" aria-label="Marcar como ${p.tipo==='cobrar'?'cobrado':'pagado'}">✓</button><div class="body row" data-pend="${p.id}" style="gap:12px"><div class="ico" style="background:${c.color}22">${c.emoji}</div><div class="body"><div class="t">${esc(p.nota||c.nombre)}</div><div class="s">${p.tipo==='cobrar'?'A cobrar':'A pagar'} · ${esc(c.nombre)}</div></div><div class="amt"><div class="num ${p.tipo==='cobrar'?'in':'out'}">${p.tipo==='cobrar'?'+':'−'}${fmtMoney(montoARS(p))}${p.moneda==='USD'?`<span class="usd">${fmtUsd(p.montoUsd)} · TC hoy</span>`:''}</div><div class="s">${pill}</div></div></div></div>`}
function bindItems(root){root.querySelectorAll('[data-mov]').forEach(e=>e.onclick=()=>formMovimiento(D.movimientos.find(m=>m.id===e.dataset.mov)));root.querySelectorAll('[data-pend]').forEach(e=>e.onclick=()=>formPendiente(D.pendientes.find(m=>m.id===e.dataset.pend)));root.querySelectorAll('[data-chk]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const p=D.pendientes.find(x=>x.id===b.dataset.chk);if(confirm(`¿Marcar "${p.nota||cat(p.catId).nombre}" como ${p.tipo==='cobrar'?'cobrado':'pagado'} hoy por ${fmtMoney(montoARS(p))}?`))confirmarPendiente(p)})}
function confirmarPendiente(p,o){o=o||p;const usd=o.moneda==='USD';if(usd&&!tcHoy()){toast('No hay cotización del dólar; cargala en Ajustes');return}
  const mov={id:uid(),tipo:p.tipo==='cobrar'?'ingreso':'egreso',monto:usd?Math.round(o.montoUsd*tcHoy()):o.monto,catId:o.catId,fecha:today(),nota:o.nota,creado:Date.now()};
  if(usd)Object.assign(mov,{moneda:'USD',montoUsd:o.montoUsd,tc:tcHoy()});
  D.movimientos.push(mov);D.pendientes=D.pendientes.filter(x=>x.id!==p.id);save();closeSheet();render();toast(p.tipo==='cobrar'?'Cobro registrado 🎉':'Pago registrado')}

/* ===================== MOVIMIENTOS ===================== */
let movY=new Date().getFullYear(),movM=new Date().getMonth()+1,movFiltro='todos',movQ='';
function renderMov(){
  const v=$('#v-mov');
  let list=movsMes(movY,movM);
  if(movFiltro!=='todos')list=list.filter(m=>m.tipo===movFiltro);
  if(movQ)list=list.filter(m=>(m.nota+' '+cat(m.catId).nombre).toLowerCase().includes(movQ.toLowerCase()));
  list.sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0));
  const ing=sum(list.filter(m=>m.tipo==='ingreso').map(m=>m.monto)),egr=sum(list.filter(m=>m.tipo==='egreso').map(m=>m.monto));
  let html=`<div class="month-nav"><button id="mPrev">‹</button><b>${MESES[movM-1]} ${movY}</b><button id="mNext">›</button></div>
  <div class="seg" style="margin-bottom:10px"><button data-f="todos" class="${movFiltro==='todos'?'on':''}">Todos</button><button data-f="ingreso" class="${movFiltro==='ingreso'?'on ing':''}">Entradas</button><button data-f="egreso" class="${movFiltro==='egreso'?'on egr':''}">Salidas</button></div>
  <input class="input" id="movQ" placeholder="Buscar…" value="${esc(movQ)}" style="margin-bottom:12px">
  <div class="grid2" style="margin-bottom:14px"><div class="tile"><div class="label">Entradas</div><div class="val in num">+${fmtMoney(ing,true)}</div></div><div class="tile"><div class="label">Salidas</div><div class="val out num">−${fmtMoney(egr,true)}</div></div></div>
  <div class="card tight" style="padding-top:4px;padding-bottom:4px">`;
  if(!list.length)html+=`<div class="empty"><div class="big">🗓️</div>Sin movimientos en este período.</div>`;
  else{let last=null;list.forEach(m=>{if(m.fecha!==last){last=m.fecha;const dt=sum(list.filter(x=>x.fecha===m.fecha).map(x=>x.tipo==='ingreso'?x.monto:-x.monto));html+=`<div class="day-h"><span>${fmtDate(m.fecha)}</span><span class="num">${dt>=0?'+':'−'}${fmtMoney(Math.abs(dt),true)}</span></div>`}html+=movItem(m).replace('class="item"','class="item" style="border-top:0"')})}
  html+=`</div>`;
  v.innerHTML=html;bindItems(v);
  $('#mPrev').onclick=()=>{movM--;if(movM<1){movM=12;movY--}renderMov()};
  $('#mNext').onclick=()=>{movM++;if(movM>12){movM=1;movY++}renderMov()};
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{movFiltro=b.dataset.f;renderMov()});
  const q=$('#movQ');q.oninput=()=>{movQ=q.value;const pos=q.selectionStart;renderMov();const nq=$('#movQ');nq.focus();nq.setSelectionRange(pos,pos)};
}

function catChips(tipo,selId,name='catId'){return `<div class="chips" id="chips-${name}">${D.categorias.filter(c=>c.tipo===tipo).map(c=>`<button type="button" class="chip ${c.id===selId?'on':''}" data-id="${c.id}">${c.emoji} ${esc(c.nombre)}</button>`).join('')}<button type="button" class="chip" data-new="1">＋ Nueva</button></div>`}
function bindChips(root,name,onPick,tipoFn){const box=root.querySelector('#chips-'+name);box.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(b.dataset.new){formCategoria(null,tipoFn(),c=>{box.outerHTML=catChips(tipoFn(),c.id,name);bindChips(root,name,onPick,tipoFn);onPick(c.id)});return}box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');onPick(b.dataset.id)})}

/* Campo de monto con selector de moneda ($ / US$) y conversión en vivo.
   st = {moneda, tc}: tc fijo (movimiento ya registrado) o null para usar el TC de hoy. */
function montoBox(valor,st){return `<div class="row between" style="margin-bottom:8px"><label class="f" style="margin:0">Monto</label><div class="cur" id="curSel"><button type="button" data-m="ARS" class="${st.moneda==='ARS'?'on':''}">$ Pesos</button><button type="button" data-m="USD" class="${st.moneda==='USD'?'on':''}">US$ Dólares</button></div></div>
  <div class="amount-input"><span id="curSym">${st.moneda==='USD'?'US$':'$'}</span><input id="fMonto" type="text" inputmode="decimal" placeholder="0" value="${valor??''}" autocomplete="off"></div><div class="conv" id="conv"></div>`}
function bindMoneda(s,st){
  const upd=()=>{const v=parseNum($('#fMonto').value);const tc=st.tc||tcHoy();const c=$('#conv');$('#curSym').textContent=st.moneda==='USD'?'US$':'$';
    if(st.moneda==='USD')c.innerHTML=!tc?'⚠️ Sin cotización del dólar. <a href="#" id="goTc">Cargala en Ajustes</a>':v>0?`≈ <b>${fmtMoney(Math.round(v*tc))}</b> al TC ${fmtMoney(tc)} ${st.tc?'(congelado el día del registro)':'(BNA venta, hoy)'}`:`TC ${fmtMoney(tc)} · ${st.tc?'congelado el día del registro':tcLabel()}`;
    else c.innerHTML=(v>0&&tc)?`≈ ${fmtUsd(v/tc)} al TC ${fmtMoney(tc)}`:'';
    const g=$('#goTc');if(g)g.onclick=e=>{e.preventDefault();closeSheet();go('ajustes')}};
  s.querySelectorAll('#curSel button').forEach(b=>b.onclick=()=>{st.moneda=b.dataset.m;s.querySelectorAll('#curSel button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
  $('#fMonto').addEventListener('input',upd);upd();
}
/* Devuelve {moneda, monto(ARS), montoUsd?, tc?} a partir del campo; null si no es válido */
function leerMonto(st,freeze){const v=parseNum($('#fMonto').value);if(v<=0){toast('Ingresá un monto');return null}
  if(st.moneda==='USD'){const tc=st.tc||tcHoy();if(!tc){toast('Falta la cotización del dólar (Ajustes)');return null}const o={moneda:'USD',montoUsd:v,monto:Math.round(v*tc)};if(freeze)o.tc=tc;return o}
  return {moneda:'ARS',monto:v}}

function formMovimiento(m){
  const edit=!!m;let tipo=m?.tipo||'egreso';let catId=m?.catId||D.categorias.find(c=>c.tipo===tipo)?.id;
  const st={moneda:m?.moneda||'ARS',tc:m?.tc||null};
  const s=openSheet(`
    <h2>${edit?'Editar movimiento':'Nuevo movimiento'}</h2>
    <div class="seg" id="segTipo" style="margin-bottom:14px"><button data-t="ingreso" class="${tipo==='ingreso'?'on ing':''}">↓ Entrada</button><button data-t="egreso" class="${tipo==='egreso'?'on egr':''}">↑ Salida</button></div>
    ${montoBox(m?(m.moneda==='USD'?m.montoUsd:m.monto):'',st)}
    <label class="f">Categoría</label>
    <div id="catBox">${catChips(tipo,catId)}</div>
    <label class="f">Fecha</label><input class="input" id="fFecha" type="date" value="${m?.fecha||today()}">
    <label class="f">Detalle (opcional)</label><input class="input" id="fNota" placeholder="Ej: Factura de luz" value="${esc(m?.nota||'')}">
    <div style="height:18px"></div>
    <button class="btn" id="fSave">${edit?'Guardar cambios':'Agregar'}</button>
    ${edit?`<div style="height:10px"></div><button class="btn danger" id="fDel">Eliminar</button>`:''}`);
  const bind=()=>bindChips(s,'catId',id=>catId=id,()=>tipo);bind();
  s.querySelectorAll('#segTipo button').forEach(b=>b.onclick=()=>{tipo=b.dataset.t;s.querySelectorAll('#segTipo button').forEach(x=>x.className='');b.className='on '+(tipo==='ingreso'?'ing':'egr');catId=D.categorias.find(c=>c.tipo===tipo)?.id;$('#catBox').innerHTML=catChips(tipo,catId);bind()});
  bindMoneda(s,st);
  setTimeout(()=>{if(!edit)$('#fMonto').focus()},150);
  $('#fSave').onclick=()=>{const mo=leerMonto(st,true);if(!mo)return;if(!catId){toast('Elegí una categoría');return}
    const obj=Object.assign({id:m?.id||uid(),tipo,catId,fecha:$('#fFecha').value||today(),nota:$('#fNota').value.trim(),creado:m?.creado||Date.now()},mo);
    if(edit)D.movimientos=D.movimientos.map(x=>x.id===m.id?obj:x);else D.movimientos.push(obj);
    save();closeSheet();render();toast(edit?'Guardado':'Movimiento agregado')};
  if(edit)$('#fDel').onclick=()=>{if(confirm('¿Eliminar este movimiento?')){D.movimientos=D.movimientos.filter(x=>x.id!==m.id);save();closeSheet();render();toast('Eliminado')}};
}

/* ===================== PENDIENTES / PROYECCIÓN ===================== */
function renderPend(){
  const v=$('#v-pend');const t=totales();
  const list=[...D.pendientes].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  // proyección mensual próximos 6 meses
  const now=new Date();const meses=[];let acc=t.disponible;
  const vencidos=list.filter(p=>daysDiff(p.fecha)<0);
  for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);const y=d.getFullYear(),mo=d.getMonth()+1;
    const ps=list.filter(p=>{const [yy,mm]=p.fecha.split('-').map(Number);return (yy===y&&mm===mo)||(i===0&&daysDiff(p.fecha)<0)});
    const c=sum(ps.filter(p=>p.tipo==='cobrar').map(montoARS)),pg=sum(ps.filter(p=>p.tipo==='pagar').map(montoARS));acc+=c-pg;
    meses.push({label:MESES_C[mo-1],cobrar:c,pagar:pg,saldo:acc})}
  v.innerHTML=`
  <div class="card">
    <div class="row between"><h3>Proyección del saldo</h3><span class="small muted">Próximos 6 meses</span></div>
    <div style="margin:8px 0 2px" class="row between"><div><div class="small muted">Hoy disponible</div><b class="num">${fmtMoney(t.disponible)}</b></div><div style="text-align:right"><div class="small muted">Dentro de 6 meses</div><b class="num ${meses[5].saldo<0?'out':'in'}">${fmtMoney(meses[5].saldo)}</b></div></div>
    ${lineChart(meses.map(m=>m.saldo),meses.map(m=>m.label),{start:t.disponible})}
    <div class="legend"><span><i style="background:var(--in)"></i>A cobrar ${fmtMoney(t.cobrar,true)}</span><span><i style="background:var(--out)"></i>A pagar ${fmtMoney(t.pagar,true)}</span></div>
  </div>
  ${vencidos.length?`<div class="card tight" style="border-left:4px solid var(--out)"><h3 style="color:var(--out)">Vencidos</h3>${vencidos.map(pendItem).join('')}</div>`:''}
  <div class="card tight"><div class="row between" style="margin-bottom:4px"><h3>A cobrar</h3><b class="in num">${fmtMoney(t.cobrar,true)}</b></div>
   ${list.filter(p=>p.tipo==='cobrar'&&daysDiff(p.fecha)>=0).map(pendItem).join('')||'<div class="empty small">Nada pendiente de cobro.</div>'}</div>
  <div class="card tight"><div class="row between" style="margin-bottom:4px"><h3>A pagar</h3><b class="out num">${fmtMoney(t.pagar,true)}</b></div>
   ${list.filter(p=>p.tipo==='pagar'&&daysDiff(p.fecha)>=0).map(pendItem).join('')||'<div class="empty small">Nada pendiente de pago.</div>'}</div>
  <p class="small muted" style="text-align:center;margin:0 8px">Tildá el círculo ✓ cuando lo cobres o pagues: pasa a movimientos con la fecha de hoy${tcHoy()?' (si es en dólares, queda congelado al TC de hoy)':''}. Tocá el pendiente para editarlo.</p>`;
  bindItems(v);bindChartTips(v);
}
function formPendiente(p){

/* ===================== ANÁLISIS ===================== */
let anaY=new Date().getFullYear();
function renderAna(){
  const v=$('#v-ana');
  const years=[...new Set(D.movimientos.map(m=>+m.fecha.slice(0,4)))].sort();if(!years.includes(anaY))years.push(anaY);years.sort();
  const movs=D.movimientos.filter(m=>+m.fecha.slice(0,4)===anaY);
  const ingM=Array(12).fill(0),egrM=Array(12).fill(0);
  movs.forEach(m=>{const i=+m.fecha.slice(5,7)-1;if(m.tipo==='ingreso')ingM[i]+=m.monto;else egrM[i]+=m.monto});
  const ing=sum(ingM),egr=sum(egrM);
  const byCat=(tipo)=>{const o={};movs.filter(m=>m.tipo===tipo).forEach(m=>o[m.catId]=(o[m.catId]||0)+m.monto);return Object.entries(o).map(([id,v])=>({c:cat(id),v})).sort((a,b)=>b.v-a.v)};
  const gastosCat=byCat('egreso'),ingCat=byCat('ingreso');
  const mesesConGasto=egrM.map((v,i)=>({v,i})).filter(x=>x.v>0);
  const maxG=mesesConGasto.length?mesesConGasto.reduce((a,b)=>b.v>a.v?b:a):null;
  const minG=mesesConGasto.length?mesesConGasto.reduce((a,b)=>b.v<a.v?b:a):null;
  const mesesConDatos=ingM.map((v,i)=>v+egrM[i]>0).filter(Boolean).length||1;
  const promG=egr/mesesConDatos;
  const now=new Date();const mesAct=anaY===now.getFullYear()?now.getMonth():11;
  const gastoMesAct=egrM[mesAct],gastoMesAnt=mesAct>0?egrM[mesAct-1]:0;
  const insights=[];
  if(gastosCat[0])insights.push(['🔥',`Donde más gastás: ${gastosCat[0].c.emoji} ${esc(gastosCat[0].c.nombre)}`,`${fmtMoney(gastosCat[0].v)} · ${Math.round(gastosCat[0].v/egr*100)}% de tus gastos del año`]);
  if(ingCat[0])insights.push(['💎',`De donde más recibís: ${ingCat[0].c.emoji} ${esc(ingCat[0].c.nombre)}`,`${fmtMoney(ingCat[0].v)} · ${Math.round(ingCat[0].v/ing*100)}% de tus ingresos del año`]);
  if(maxG)insights.push(['📈',`Mes de mayor gasto: ${MESES[maxG.i]}`,fmtMoney(maxG.v)]);
  if(minG&&mesesConGasto.length>1)insights.push(['📉',`Mes de menor gasto: ${MESES[minG.i]}`,fmtMoney(minG.v)]);
  if(gastoMesAnt>0&&gastoMesAct>0){const d=(gastoMesAct-gastoMesAnt)/gastoMesAnt*100;insights.push([d>0?'⚠️':'✅',`${MESES[mesAct]} vs ${MESES[mesAct-1]}: gastaste ${Math.abs(Math.round(d))}% ${d>0?'más':'menos'}`,`${fmtMoney(gastoMesAct)} contra ${fmtMoney(gastoMesAnt)}`])}
  if(ing>0)insights.push(['🏦',`Ahorrás el ${Math.max(0,Math.round((ing-egr)/ing*100))}% de lo que ingresa`,`Entradas ${fmtMoney(ing,true)} · Salidas ${fmtMoney(egr,true)}`]);
  D.alcancias.forEach(a=>{const falta=alcObj(a)-alcAho(a);if(falta>0){const neto=(ing-egr)/mesesConDatos;insights.push([a.emoji,`${esc(a.nombre)}: faltan ${fmtMoney(falta)}`,neto>0?`A tu ritmo de ahorro (${fmtMoney(neto,true)}/mes) llegás en ~${Math.ceil(falta/neto)} ${Math.ceil(falta/neto)===1?'mes':'meses'}`:`${Math.round(a.ahorrado/a.objetivo*100)}% completado`])}else insights.push([a.emoji,`${esc(a.nombre)}: ¡objetivo logrado! 🎉`,fmtAlc(a,a.ahorrado)])});

  v.innerHTML=`
  <div class="month-nav"><button id="yPrev">‹</button><b>Año ${anaY}</b><button id="yNext">›</button></div>
  <div class="grid2" style="margin-bottom:14px">
    <div class="tile"><div class="label">Entradas ${anaY}</div><div class="val in num">${fmtMoney(ing,true)}</div></div>
    <div class="tile"><div class="label">Salidas ${anaY}</div><div class="val out num">${fmtMoney(egr,true)}</div></div>
    <div class="tile"><div class="label">Resultado</div><div class="val num ${ing-egr>=0?'in':'out'}">${fmtMoney(ing-egr,true)}</div></div>
    <div class="tile"><div class="label">Gasto promedio/mes</div><div class="val num">${fmtMoney(promG,true)}</div></div>
  </div>
  ${movs.length?`
  <div class="card"><h3>Entradas y salidas por mes</h3>${barChart(ingM,egrM)}<div class="legend"><span><i style="background:var(--in)"></i>Entradas</span><span><i style="background:var(--out)"></i>Salidas</span></div></div>
  <div class="card"><h3>Lo que te dicen tus números</h3><div style="margin-top:6px">${insights.map(([e,t,s])=>`<div class="insight"><div class="e">${e}</div><div><b>${t}</b><span>${s}</span></div></div>`).join('')}</div></div>
  ${gastosCat.length?`<div class="card"><h3>Gastos por categoría</h3><div class="row" style="gap:16px;margin-top:8px;align-items:center">${donut(gastosCat.slice(0,8),egr)}<div class="pct" style="flex:1;min-width:0">${gastosCat.slice(0,8).map(x=>`<div class="bar-row"><div class="n">${x.c.emoji} ${esc(x.c.nombre)}</div><div class="b"><i style="width:${x.v/gastosCat[0].v*100}%;background:${x.c.color}"></i></div><div class="v num">${Math.round(x.v/egr*100)}%</div></div>`).join('')}</div></div>
    <div style="margin-top:8px">${gastosCat.map(x=>`<div class="row between small" style="padding:6px 0;border-top:1px solid var(--line)"><span>${x.c.emoji} ${esc(x.c.nombre)}</span><b class="num">${fmtMoney(x.v)}</b></div>`).join('')}</div></div>`:''}
  ${ingCat.length?`<div class="card"><h3>Ingresos por categoría</h3><div style="margin-top:8px">${ingCat.map(x=>`<div class="bar-row"><div class="n">${x.c.emoji} ${esc(x.c.nombre)}</div><div class="b"><i style="width:${x.v/ingCat[0].v*100}%;background:${x.c.color}"></i></div><div class="v num">${fmtMoney(x.v,true)}</div></div>`).join('')}</div></div>`:''}
  <div class="card"><h3>Detalle mensual</h3><table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:14px" class="num"><tr class="small muted" style="text-align:right"><th style="text-align:left;font-weight:600;padding:6px 0">Mes</th><th style="font-weight:600">Entradas</th><th style="font-weight:600">Salidas</th><th style="font-weight:600">Neto</th></tr>
   ${ingM.map((x,i)=>(x+egrM[i])>0?`<tr style="border-top:1px solid var(--line);text-align:right"><td style="text-align:left;padding:7px 0;text-transform:capitalize">${MESES[i]}</td><td class="in">${fmtMoney(x,true)}</td><td class="out">${fmtMoney(egrM[i],true)}</td><td style="font-weight:700" class="${x-egrM[i]>=0?'in':'out'}">${fmtMoney(x-egrM[i],true)}</td></tr>`:'').join('')}</table></div>`
  :`<div class="card"><div class="empty"><div class="big">📊</div>Sin datos en ${anaY}.<br>Cargá movimientos para ver el análisis.</div></div>`}`;
  $('#yPrev').onclick=()=>{anaY--;renderAna()};$('#yNext').onclick=()=>{anaY++;renderAna()};
  bindChartTips(v);
}

/* ---- gráficos SVG ---- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
function barChart(a,b){
  const W=520,H=200,pl=44,pr=6,pt=10,pb=24;const max=niceMax(Math.max(...a,...b)*1.05);const iw=W-pl-pr,ih=H-pt-pb;const gw=iw/12;const bw=Math.min(14,gw*0.36);
  const y=v=>pt+ih-(v/max)*ih;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:8px"><g class="grid">`;
  for(let i=0;i<=4;i++){const yy=pt+ih*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${fmtMoney(max*(4-i)/4,true).replace('$','')}</text>`}
  s+=`</g>`;
  for(let i=0;i<12;i++){const cx=pl+gw*i+gw/2;
    if(a[i]>0)s+=`<rect x="${cx-bw-1}" y="${y(a[i])}" width="${bw}" height="${Math.max(2,y(0)-y(a[i]))}" rx="3" fill="var(--in)" data-tip="${MESES[i]}: +${fmtMoney(a[i])}"/>`;
    if(b[i]>0)s+=`<rect x="${cx+1}" y="${y(b[i])}" width="${bw}" height="${Math.max(2,y(0)-y(b[i]))}" rx="3" fill="var(--out)" data-tip="${MESES[i]}: −${fmtMoney(b[i])}"/>`;
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle">${MESES_C[i]}</text>`}
  s+=`<line class="base" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/></svg>`;return s}
function lineChart(vals,labels,opt={}){
  const W=520,H=170,pl=50,pr=14,pt=14,pb=24;const all=[...vals,opt.start??vals[0]];const mx=Math.max(...all),mn=Math.min(...all);const span=(mx-mn)||Math.abs(mx)*.2||1;const top=mx+span*.25,bot=mn-span*.25;
  const iw=W-pl-pr,ih=H-pt-pb;const x=i=>pl+iw*i/(vals.length-1);const y=v=>pt+ih*(1-(v-bot)/(top-bot));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:8px"><g class="grid">`;
  for(let i=0;i<=3;i++){const v=bot+(top-bot)*i/3;const yy=y(v);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-6}" y="${yy+4}" text-anchor="end">${fmtMoney(v,true).replace('$','')}</text>`}
  s+=`</g>`;if(bot<0&&top>0)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--out)" stroke-dasharray="3 3" opacity=".6"/>`;
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  s+=`<polygon points="${x(0)},${y(bot)} ${pts} ${x(vals.length-1)},${y(bot)}" fill="var(--brand)" opacity=".10"/><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${v<0?'var(--out)':'var(--brand)'}" stroke="var(--surface)" stroke-width="2" data-tip="${labels[i]}: ${fmtMoney(v)}"/><text x="${x(i)}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`;if(i===vals.length-1||i===0)s+=`<text x="${x(i)+(i===0?-6:6)}" y="${y(v)-11}" text-anchor="${i===0?'start':'end'}" style="fill:var(--ink);font-weight:600">${fmtMoney(v,true)}</text>`});
  return s+'</svg>'}
function donut(items,total){
  const R=52,r=34,C=2*Math.PI*R;let off=0;let s=`<svg viewBox="0 0 120 120" width="120" height="120" style="flex-shrink:0">`;
  items.forEach(x=>{const f=x.v/total;const len=Math.max(0,C*f-2);s+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${x.c.color}" stroke-width="${R-r}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)" data-tip="${x.c.emoji} ${esc(x.c.nombre)}: ${fmtMoney(x.v)}"/>`;off+=C*f});
  s+=`<text x="60" y="57" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">Gastos</text><text x="60" y="72" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">${fmtMoney(total,true)}</text></svg>`;return s}
function bindChartTips(root){const tip=$('#tip');root.querySelectorAll('[data-tip]').forEach(e=>{const show=ev=>{tip.textContent=e.dataset.tip;tip.style.display='block';const p=ev.touches?ev.touches[0]:ev;const r=tip.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(window.innerWidth-r.width-8,p.clientX-r.width/2))+'px';tip.style.top=(p.clientY-r.height-14)+'px'};e.addEventListener('mousemove',show);e.addEventListener('mouseleave',()=>tip.style.display='none');e.addEventListener('touchstart',ev=>{show(ev);clearTimeout(tip._t);tip._t=setTimeout(()=>tip.style.display='none',1800)},{passive:true})})}

/* ===================== AJUSTES / CATEGORÍAS / RESPALDO ===================== */
function renderAjustes(){
  const v=$('#v-ajustes');
  const catList=t=>D.categorias.filter(c=>c.tipo===t).map(c=>`<div class="item" data-cat="${c.id}"><div class="ico" style="background:${c.color}22">${c.emoji}</div><div class="body"><div class="t">${esc(c.nombre)}</div><div class="s">${D.movimientos.filter(m=>m.catId===c.id).length} movimientos</div></div><span class="muted">›</span></div>`).join('');
  v.innerHTML=`
  <div class="card tight"><div class="row between" style="margin-bottom:4px"><h3>Categorías de entradas</h3><button class="link" data-newcat="ingreso">＋ Nueva</button></div>${catList('ingreso')}</div>
  <div class="card tight"><div class="row between" style="margin-bottom:4px"><h3>Categorías de salidas</h3><button class="link" data-newcat="egreso">＋ Nueva</button></div>${catList('egreso')}</div>
  <div class="card"><h3>Dólar · TC Banco Nación venta</h3>
    <div class="row between" style="margin:8px 0"><div><div class="num" style="font-size:26px;font-weight:800">${tcHoy()?fmtMoney(tcHoy()):'—'}</div><div class="small muted">${tcLabel()}${D.config.tc?.fuente&&!D.config.tc.manual?' · '+D.config.tc.fuente:''}</div></div><button class="btn sm sec" id="btnTc">↻ Actualizar</button></div>
    <p class="small muted" style="margin:0 0 10px">Se actualiza sola al abrir la app con conexión. Los pendientes y alcancías en dólares usan siempre esta cotización; los movimientos ya registrados quedan al TC del día en que se cargaron.</p>
    <div class="row" style="gap:8px"><input class="input" id="tcManual" type="text" inputmode="decimal" placeholder="Cargar a mano, ej: 1450" style="flex:1"><button class="btn sm" id="btnTcManual">Usar</button></div>
  </div>
  <div class="card"><h3>Formato</h3><div class="switch"><div><b>Mostrar centavos</b><div class="small muted">Montos con dos decimales</div></div><button class="tog ${D.config.decimales?'on':''}" id="togDec"></button></div></div>
  <div class="card"><h3>Respaldo</h3><p class="small muted" style="margin:6px 0 12px">Tus datos viven sólo en este celular. Exportá un respaldo cada tanto y guardalo (Drive, mail, etc.) para no perderlo si cambiás de teléfono.</p>
    <div class="row" style="gap:8px"><button class="btn sm" id="btnExp" style="flex:1">⬇ Exportar respaldo</button><button class="btn sm sec" id="btnImp" style="flex:1">⬆ Importar</button></div>
    <input type="file" id="fileImp" accept="application/json,.json" hidden>
    <div style="height:8px"></div><button class="btn sm sec" id="btnCsv" style="width:100%">📄 Exportar movimientos a CSV (Excel)</button>
  </div>
  <div class="card"><h3>Zona de riesgo</h3><div style="height:8px"></div><button class="btn danger sm" id="btnReset" style="width:100%">Borrar todos los datos</button></div>
  <p class="small muted" style="text-align:center">Flujo de Caja · v1.0 · ${D.movimientos.length} movimientos guardados</p>`;
  v.querySelectorAll('[data-newcat]').forEach(b=>b.onclick=()=>formCategoria(null,b.dataset.newcat,()=>render()));
  v.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>formCategoria(D.categorias.find(c=>c.id===e.dataset.cat),null,()=>render()));
  $('#btnTc').onclick=async()=>{const b=$('#btnTc');b.textContent='…';const ok=await actualizarTC(true);render();toast(ok?'Cotización actualizada':'No se pudo actualizar (¿sin conexión?)')};
  $('#btnTcManual').onclick=()=>{const v=parseNum($('#tcManual').value);if(v<=0){toast('Ingresá un valor');return}D.config.tc={valor:v,fecha:new Date().toISOString(),fuente:'manual',manual:true};save();render();toast('Cotización guardada')};
  $('#togDec').onclick=()=>{D.config.decimales=D.config.decimales?0:2;save();render()};
  $('#btnExp').onclick=exportar;$('#btnImp').onclick=()=>$('#fileImp').click();$('#fileImp').onchange=importar;$('#btnCsv').onclick=exportCsv;
  $('#btnReset').onclick=()=>{if(confirm('¿Borrar TODOS los datos de esta app? No se puede deshacer.')&&confirm('¿Seguro? Te recomendamos exportar un respaldo antes.')){D=defaultData();save();render();toast('Datos borrados')}};
}
function formCategoria(c,tipo,done){
  const edit=!!c;tipo=c?.tipo||tipo;let color=c?.color||PALETTE[D.categorias.filter(x=>x.tipo===tipo).length%PALETTE.length],emoji=c?.emoji||'🏷️';
  const s=openSheet(`<h2>${edit?'Editar categoría':'Nueva categoría de '+(tipo==='ingreso'?'entrada':'salida')}</h2>
    <label class="f">Nombre</label><input class="input" id="fNombre" value="${esc(c?.nombre||'')}" placeholder="Ej: Alquiler">
    <label class="f">Ícono</label><div class="emojis" id="fEmojis">${['🏷️',...EMOJIS].map(e=>`<button type="button" class="${e===emoji?'on':''}" data-e="${e}">${e}</button>`).join('')}</div>
    <label class="f">Color</label><div class="colors" id="fColors">${PALETTE.map(x=>`<button type="button" class="${x===color?'on':''}" data-c="${x}" style="background:${x}"></button>`).join('')}</div>
    <div style="height:18px"></div><button class="btn" id="fSave">${edit?'Guardar':'Crear'}</button>
    ${edit?`<div style="height:10px"></div><button class="btn danger" id="fDel">Eliminar categoría</button>`:''}`);
  s.querySelectorAll('#fEmojis button').forEach(b=>b.onclick=()=>{emoji=b.dataset.e;s.querySelectorAll('#fEmojis button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  s.querySelectorAll('#fColors button').forEach(b=>b.onclick=()=>{color=b.dataset.c;s.querySelectorAll('#fColors button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  setTimeout(()=>{if(!edit)$('#fNombre').focus()},150);
  $('#fSave').onclick=()=>{const nombre=$('#fNombre').value.trim();if(!nombre){toast('Poné un nombre');return}let out;if(edit){Object.assign(c,{nombre,color,emoji});out=c}else{out={id:uid(),nombre,tipo,color,emoji};D.categorias.push(out)}save();closeSheet();done&&done(out);toast('Categoría guardada')};
  if(edit)$('#fDel').onclick=()=>{const n=D.movimientos.filter(m=>m.catId===c.id).length+D.pendientes.filter(m=>m.catId===c.id).length;if(n>0){toast('Tiene '+n+' registros asociados; reasignalos primero');return}if(confirm('¿Eliminar la categoría?')){D.categorias=D.categorias.filter(x=>x.id!==c.id);save();closeSheet();done&&done()}};
}
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},500)}
function exportar(){download('flujo-caja-respaldo-'+today()+'.json',JSON.stringify({app:'flujo-caja',version:1,fecha:new Date().toISOString(),data:D},null,1),'application/json');toast('Respaldo exportado')}
function importar(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;if(!d.movimientos||!d.categorias)throw 0;if(confirm('Esto reemplaza los datos actuales por los del respaldo ('+d.movimientos.length+' movimientos). ¿Continuar?')){D=Object.assign(defaultData(),d);save();render();toast('Respaldo importado')}}catch(x){toast('Archivo no válido')}};r.readAsText(f);e.target.value=''}
function exportCsv(){const rows=[['Fecha','Tipo','Categoria','Detalle','Monto ARS','Dolares','TC']];[...D.movimientos].sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(m=>rows.push([m.fecha,m.tipo==='ingreso'?'Entrada':'Salida',cat(m.catId).nombre,m.nota||'',(m.tipo==='ingreso'?m.monto:-m.monto).toString().replace('.',','),m.moneda==='USD'?String(m.montoUsd).replace('.',','):'',m.moneda==='USD'?String(m.tc).replace('.',','):'']));download('movimientos-'+today()+'.csv','﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8');toast('CSV exportado')}

/* ===================== INSTALACIÓN (PWA) ===================== */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setupInstall()});
function setupInstall(){const box=$('#installBox');if(!box)return;const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(standalone||localStorage.getItem('fc_hide_install')){box.classList.remove('show');return}
  if(deferredPrompt){box.classList.add('show');$('#installBtn').onclick=async()=>{deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted')box.classList.remove('show')}}
  else if(isIOS){box.classList.add('show');$('#installBtn').textContent='Cómo';$('#installBtn').onclick=()=>{openSheet(`<h2>Instalar en iPhone / iPad</h2><ol style="padding-left:20px;line-height:1.7"><li>Abrí esta página en <b>Safari</b>.</li><li>Tocá el botón <b>Compartir</b> <span style="font-size:18px">⎋</span> (cuadrado con flecha hacia arriba).</li><li>Elegí <b>“Agregar a pantalla de inicio”</b>.</li><li>Confirmá con <b>Agregar</b>. ¡Listo!</li></ol><button class="btn sec" id="hideInst">No volver a mostrar</button>`);$('#hideInst').onclick=()=>{localStorage.setItem('fc_hide_install','1');closeSheet();render()}}}
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('caja-sw.js').catch(()=>{}));

render();
actualizarTC().then(ok=>{if(ok)render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)actualizarTC().then(ok=>{if(ok)render()})});
window.addEventListener('online',()=>actualizarTC().then(ok=>{if(ok)render()}));
</script>
</body>
